<!DOCTYPE html>
<html class="light" lang="ko-KR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Joomoon OMS — Role-Based Landing Workspace</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] antialiased min-h-screen flex">
  <!-- LEFT FIXED EXECUTIVE SIDEBAR (#0F172A) -->
  <aside class="w-[268px] bg-[#0F172A] text-slate-200 flex flex-col justify-between shrink-0 min-h-screen border-r border-slate-800">
    <div>
      <!-- Brand Header -->
      <div class="p-6 border-b border-slate-800/80">
        <a href="portal.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-[#1E3A5F] border border-slate-600/60 flex items-center justify-center text-white font-bold text-sm">
            JM
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-base font-bold tracking-tight text-white">JOOMOON</span>
              <span id="sidebarRoleBadge" class="font-mono-code text-[10px] px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">Manager</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="brandSubtitle">Global Hair & Order System</p>
          </div>
        </a>
      </div>

      <!-- Active User Summary Card in Sidebar -->
      <div class="px-4 py-4 border-b border-slate-800/80 bg-slate-900/50">
        <div class="flex items-center justify-between">
          <span id="sidebarUserCode" class="font-mono-code text-xs font-semibold text-blue-300">MGR-001</span>
          <span id="sidebarCountryCurrency" class="font-mono-code text-[11px] text-slate-400">🇰🇷 KR · KRW</span>
        </div>
        <div id="sidebarDisplayName" class="text-sm font-semibold text-white truncate mt-1">Loading...</div>
        <div id="sidebarSubName" class="text-xs text-slate-400 truncate">-</div>
      </div>

      <!-- Role-Specific Dynamic Navigation Menu -->
      <div class="p-4">
        <div id="sidebarMenuHeader" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 px-3 mb-2">
          ROLE NAVIGATION
        </div>
        <nav id="sidebarNavList" class="space-y-1">
          <!-- Populated dynamically according to user_type (Manager / Buyer / Customer) -->
        </nav>
      </div>
    </div>

    <!-- Sidebar Footer: Quick Sample Account Switcher -->
    <div class="p-4 border-t border-slate-800 bg-slate-900/60 space-y-2.5">
      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400" data-i18n="btnSwitchRolePreview">Switch Sample Account</div>
      <select id="quickAccountSelect" onchange="handleQuickSwitch(this.value)"
        class="w-full text-xs bg-slate-800 border border-slate-700 text-slate-100 rounded-lg px-2.5 py-2 font-mono-code focus:ring-[#1E3A5F] focus:border-[#1E3A5F]">
      </select>
      <button type="button" onclick="logout()"
        class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-red-950/70 border border-slate-700 hover:border-red-800 text-slate-200 hover:text-red-200 text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        <span data-i18n="btnSignOut">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN WORKSPACE AREA -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Utility Bar -->
    <header class="h-16 bg-white border-b border-[#E2E8F0] px-6 lg:px-8 flex items-center justify-between gap-4 sticky top-0 z-20">
      <div class="flex items-center gap-3 min-w-0">
        <span class="material-symbols-outlined text-[#1E3A5F]">verified_user</span>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <span id="topRoleTitle" class="text-sm font-bold text-[#0F172A]">Landing Workspace</span>
            <span id="topUserCodePill" class="font-mono-code text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200"></span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- Primary Role Action CTA -->
        <a id="topPrimaryActionBtn" href="users.html"
          class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-[#1E3A5F] hover:bg-[#0F172A] text-white text-xs font-semibold shadow-sm transition-colors">
          <span class="material-symbols-outlined text-[16px]">manage_accounts</span>
          <span id="topPrimaryActionText">Manage Users</span>
        </a>

        <!-- Bilingual Language Switcher (EN-AU | 한국어) -->
        <div class="inline-flex items-center bg-[#F8FAFC] border border-[#CBD5E1] rounded-lg p-0.5">
          <button id="langBtnEn" type="button" onclick="switchLang('en-AU')" class="px-2.5 py-1 rounded-md text-xs font-semibold transition-colors">
            🇦🇺 EN (AU)
          </button>
          <button id="langBtnKo" type="button" onclick="switchLang('ko-KR')" class="px-2.5 py-1 rounded-md text-xs font-semibold transition-colors">
            🇰🇷 한국어
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="p-6 lg:p-8 max-w-[1520px] w-full mx-auto space-y-6">
      <!-- Executive Welcome Banner -->
      <section class="bg-white border border-[#E2E8F0] rounded-xl p-6 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-6">
        <div class="space-y-1.5">
          <div class="flex flex-wrap items-center gap-2">
            <span id="bannerRoleBadge" class="font-mono-code text-xs font-semibold px-2.5 py-0.5 rounded bg-[#1E3A5F] text-white">Manager</span>
            <span id="bannerBusinessNo" class="font-mono-code text-xs text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200"></span>
            <span id="bannerLocation" class="text-xs text-slate-500"></span>
          </div>
          <h1 class="text-2xl font-bold text-[#0F172A] tracking-tight">
            <span data-i18n="welcomePrefix">Welcome back,</span>
            <span id="bannerName" class="text-[#1E3A5F]">-</span>
          </h1>
          <p id="bannerSubtext" class="text-sm text-[#64748B]"></p>
        </div>

        <div class="flex flex-wrap items-center gap-3 shrink-0">
          <a href="users.html" id="bannerActionBtn"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-[#1E3A5F] hover:bg-[#0F172A] text-white text-sm font-semibold shadow-sm transition-colors">
            <span class="material-symbols-outlined text-[18px]">edit_square</span>
            <span id="bannerActionText">Manage Users</span>
          </a>
        </div>
      </section>

      <!-- KPI Summary Cards (4 columns) -->
      <section id="kpiGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Populated dynamically based on role -->
      </section>

      <!-- Role-Specific Menu Modules Grid -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500" data-i18n="landingQuickActions">ROLE WORKSPACE MODULES</h2>
        </div>
        <div id="roleModulesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Populated dynamically for Manager, Buyer, or Customer -->
        </div>
      </section>

      <!-- Manager View: Live Users Directory Table Preview | Buyer/Customer View: My Profile Summary Card -->
      <section id="bottomDynamicSection" class="bg-white border border-[#E2E8F0] rounded-xl p-6 shadow-sm">
        <!-- Populated dynamically -->
      </section>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    let currentUser = null;
    let directoryData = null;

    function switchLang(lang) {
      JoomoonApp.setLang(lang);
      renderAll();
    }

    async function logout() {
      await fetch('api_auth.php?action=logout', { method: 'POST' });
      window.location.href = 'index.html';
    }

    async function handleQuickSwitch(loginId) {
      if (!loginId) return;
      const res = await fetch('api_auth.php?action=quick_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login_id: loginId })
      });
      const data = await res.json();
      if (data.ok) {
        await loadPortalData();
      }
    }

    function renderLanguageButtons() {
      const lang = JoomoonApp.getLang();
      document.getElementById('langBtnEn').className = lang === 'en-AU'
        ? 'px-2.5 py-1 rounded-md text-xs font-semibold bg-[#1E3A5F] text-white'
        : 'px-2.5 py-1 rounded-md text-xs font-semibold text-slate-600 hover:bg-slate-200/70';
      document.getElementById('langBtnKo').className = lang === 'ko-KR'
        ? 'px-2.5 py-1 rounded-md text-xs font-semibold bg-[#1E3A5F] text-white'
        : 'px-2.5 py-1 rounded-md text-xs font-semibold text-slate-600 hover:bg-slate-200/70';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = JoomoonApp.t(el.getAttribute('data-i18n'));
      });
    }

    function renderSidebarAndHeader() {
      if (!currentUser) return;
      const u = currentUser;
      const isMgr = u.user_type === 'Manager';

      document.getElementById('sidebarRoleBadge').textContent = u.user_type;
      document.getElementById('sidebarUserCode').textContent = u.user_code;
      document.getElementById('sidebarCountryCurrency').textContent = `${JoomoonApp.countryFlag(u.country)} · ${u.currency}`;
      document.getElementById('sidebarDisplayName').textContent = u.company_name || u.manager_name || u.login_id;
      document.getElementById('sidebarSubName').textContent = `${u.manager_name || ''} (${u.login_id})`;

      document.getElementById('sidebarMenuHeader').textContent = JoomoonApp.t('menuHeader_' + u.user_type);

      const urlParams = new URLSearchParams(window.location.search);
      const activeMod = urlParams.get('module') || 'dashboard';
      const menus = JoomoonApp.roleMenus(u.user_type, 'portal', activeMod);

      document.getElementById('sidebarNavList').innerHTML = menus.map(m => {
        const isActive = m.id === activeMod;
        const cls = isActive
          ? 'bg-[#1E3A5F] text-white font-semibold border border-blue-800/60'
          : 'text-slate-300 hover:bg-slate-800/80 hover:text-white';
        return `
          <a href="${m.href}" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-xs transition-colors ${cls}">
            <span class="flex items-center gap-2.5">
              <span class="material-symbols-outlined text-[18px]">${m.icon}</span>
              <span>${JoomoonApp.t(m.labelKey)}</span>
            </span>
            ${m.badge ? `<span class="font-mono-code text-[10px] px-1.5 py-0.5 rounded bg-slate-900/80 text-slate-200">${m.badge}</span>` : ''}
          </a>
        `;
      }).join('');

      document.getElementById('topRoleTitle').textContent = JoomoonApp.t('role_' + u.user_type);
      document.getElementById('topUserCodePill').textContent = `${u.user_code} · ${u.login_id}`;

      const actionText = isMgr ? JoomoonApp.t('btnGoUsers') : JoomoonApp.t('btnGoMyProfile');
      document.getElementById('topPrimaryActionText').textContent = actionText;
      document.getElementById('bannerActionText').textContent = actionText;

      document.getElementById('bannerRoleBadge').textContent = JoomoonApp.t('role_' + u.user_type);
      document.getElementById('bannerBusinessNo').textContent = u.business_number || (u.user_type === 'Customer' ? 'Personal Account / 개인고객' : 'No ABN/BRN');
      document.getElementById('bannerLocation').textContent = `${u.city_district || ''}, ${u.state_province || ''} (${JoomoonApp.countryFlag(u.country)})`;
      document.getElementById('bannerName').textContent = u.company_name ? `${u.company_name} (${u.manager_name})` : u.manager_name;
      document.getElementById('bannerSubtext').textContent = u.order_memo || u.shipping_memo || '';
    }

    function renderKpisAndModules() {
      if (!currentUser || !directoryData) return;
      const u = currentUser;
      const isMgr = u.user_type === 'Manager';
      const lang = JoomoonApp.getLang();

      if (isMgr) {
        const counts = directoryData.counts || { All: 0, Manager: 0, Buyer: 0, Customer: 0 };
        document.getElementById('kpiGrid').innerHTML = `
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiTotalUsers')}</div>
            <div class="font-mono-code text-2xl font-bold text-[#0F172A] mt-1">${counts.All}</div>
            <div class="text-xs text-slate-400 mt-1">Manager: ${counts.Manager} · Active DB</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiActiveBuyers')}</div>
            <div class="font-mono-code text-2xl font-bold text-teal-700 mt-1">${counts.Buyer}</div>
            <div class="text-xs text-slate-400 mt-1">KR · AU · US Wholesale</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiDirectCustomers')}</div>
            <div class="font-mono-code text-2xl font-bold text-[#1E3A5F] mt-1">${counts.Customer}</div>
            <div class="text-xs text-slate-400 mt-1">Direct Custom Hair Clients</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiPreferredCarrier')}</div>
            <div class="font-mono-code text-base font-bold text-[#0F172A] mt-2 truncate">${u.preferred_carrier || 'DHL / CJ'}</div>
            <div class="text-xs text-emerald-600 font-medium mt-1">● All Gateways Online</div>
          </div>
        `;
      } else {
        document.getElementById('kpiGrid').innerHTML = `
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiPricingTier')}</div>
            <div class="font-mono-code text-xl font-bold text-[#1E3A5F] mt-1 uppercase">${u.price_tier} (${u.discount_rate}% OFF)</div>
            <div class="text-xs text-slate-400 mt-1">Payment: ${u.payment_terms} · ${u.tax_type}</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('f_outstanding_balance')}</div>
            <div class="font-mono-code text-xl font-bold text-amber-700 mt-1">${JoomoonApp.formatMoney(u.outstanding_balance, u.currency)}</div>
            <div class="text-xs text-slate-400 mt-1">Credit Limit: ${JoomoonApp.formatMoney(u.credit_limit, u.currency)}</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('f_deposit_balance')}</div>
            <div class="font-mono-code text-xl font-bold text-emerald-700 mt-1">${JoomoonApp.formatMoney(u.deposit_balance, u.currency)}</div>
            <div class="text-xs text-slate-400 mt-1">Bank: ${u.bank_name || '-'}</div>
          </div>
          <div class="bg-white border border-[#E2E8F0] rounded-xl p-5 shadow-sm">
            <div class="text-xs font-medium text-slate-500">${JoomoonApp.t('kpiPreferredCarrier')}</div>
            <div class="font-mono-code text-base font-bold text-[#0F172A] mt-1 truncate">${u.preferred_carrier || '-'}</div>
            <div class="text-xs text-slate-400 mt-1">Fee: ${u.shipping_fee_type} ${u.shipping_account_no ? `(${u.shipping_account_no})` : ''}</div>
          </div>
        `;
      }

      // Role Workspace Cards
      if (isMgr) {
        document.getElementById('roleModulesGrid').innerHTML = `
          <a href="users.html" class="bg-white border-2 border-[#1E3A5F] rounded-xl p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-[#1E3A5F] text-2xl">group</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-[#1E3A5F] text-white">MANAGER CRUD</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${JoomoonApp.t('menu_mgr_users')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${lang === 'ko-KR'
                  ? 'Manager(1), Buyer(3), Customer(5) 등 전체 회원의 상호, 사업자번호, 배송주소(주소1/2, 구군, 도, 국가, 우편번호), 주문 및 회계 정보를 통합 관리합니다.'
                  : 'Full CRUD management for all Managers, Wholesale Buyers, and Direct Customers including ABN/BRN, 6-field shipping addresses, and accounting settings.'}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-[#1E3A5F] flex items-center justify-between">
              <span>${JoomoonApp.t('btnGoUsers')}</span>
              <span>→</span>
            </div>
          </a>

          <a href="users.html?filter=Buyer" class="bg-white border border-[#E2E8F0] hover:border-[#1E3A5F] rounded-xl p-5 shadow-sm transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-teal-700 text-2xl">storefront</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-teal-50 text-teal-800 border border-teal-200">BUYER B2B</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${JoomoonApp.t('menu_mgr_orders')} & ${JoomoonApp.t('tabBuyers')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${lang === 'ko-KR'
                  ? '국내외 거래처(서울뷰티살롱랩, Sydney Hair Studio, LA Crown Hair)의 단가 등급, 할인율, 특송사 계정번호를 관리합니다.'
                  : 'Inspect wholesale salon buyers, pricing tiers, volume discount rates, and third-party DHL/FedEx carrier accounts.'}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-700 flex items-center justify-between">
              <span>${JoomoonApp.t('tabBuyers')}</span>
              <span>→</span>
            </div>
          </a>

          <a href="users.html?filter=Customer" class="bg-white border border-[#E2E8F0] hover:border-[#1E3A5F] rounded-xl p-5 shadow-sm transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-slate-700 text-2xl">account_balance</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">CLIENT & LEDGER</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${JoomoonApp.t('menu_mgr_accounting')} & ${JoomoonApp.t('tabCustomers')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${lang === 'ko-KR'
                  ? '개인 고객(김민수, 이지영, 정현우, Oliver Smith, Daniel Miller)의 맞춤 가발 메모, 배송지 및 정산 계좌를 관리합니다.'
                  : 'Review customer hairpiece specifications, discreet delivery instructions, and multi-currency ledger balances.'}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-700 flex items-center justify-between">
              <span>${JoomoonApp.t('tabCustomers')}</span>
              <span>→</span>
            </div>
          </a>
        `;
      } else {
        // Buyer or Customer Cards
        document.getElementById('roleModulesGrid').innerHTML = `
          <a href="users.html" class="bg-white border-2 border-[#1E3A5F] rounded-xl p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-[#1E3A5F] text-2xl">edit_note</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-[#1E3A5F] text-white">SELF-SERVICE EDIT</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${u.user_type === 'Buyer' ? JoomoonApp.t('menu_buy_profile') : JoomoonApp.t('menu_cst_profile')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${lang === 'ko-KR'
                  ? '나의 상호/사업자번호, 대표자/담당자 연락처, 기본 배송지(주소1·주소2·구군·도·국가·우편번호) 및 환불/정산 계좌를 직접 수정합니다.'
                  : 'Update your company registration, contact person, 6-field shipping address, preferred carrier, and bank/tax invoice information.'}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-[#1E3A5F] flex items-center justify-between">
              <span>${JoomoonApp.t('btnGoMyProfile')}</span>
              <span>→</span>
            </div>
          </a>

          <a href="users.html#section-shipping" class="bg-white border border-[#E2E8F0] hover:border-[#1E3A5F] rounded-xl p-5 shadow-sm transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-teal-700 text-2xl">local_shipping</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-700">${u.country} DELIVERY</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${u.user_type === 'Buyer' ? JoomoonApp.t('menu_buy_shipping') : JoomoonApp.t('menu_cst_shipping')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${u.address1 || ''} ${u.address2 || ''}, ${u.city_district || ''}, ${u.state_province || ''} ${u.postal_code || ''} (${u.country})
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-700 flex items-center justify-between">
              <span>${u.preferred_carrier || 'Carrier Settings'}</span>
              <span>→</span>
            </div>
          </a>

          <a href="users.html#section-accounting" class="bg-white border border-[#E2E8F0] hover:border-[#1E3A5F] rounded-xl p-5 shadow-sm transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="material-symbols-outlined text-slate-700 text-2xl">receipt_long</span>
                <span class="font-mono-code text-[11px] px-2 py-0.5 rounded bg-slate-100 text-slate-700">${u.currency} · ${u.tax_type}</span>
              </div>
              <h3 class="text-base font-bold text-[#0F172A]">${u.user_type === 'Buyer' ? JoomoonApp.t('menu_buy_accounting') : JoomoonApp.t('menu_cst_accounting')}</h3>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${u.bank_name || '-'} · ${u.bank_account_number || '-'} (${u.bank_account_holder || '-'})<br/>
                Tax Email: ${u.tax_invoice_email || u.email || '-'}
              </p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-700 flex items-center justify-between">
              <span>${JoomoonApp.t('sec6Title')}</span>
              <span>→</span>
            </div>
          </a>
        `;
      }
    }

    function renderBottomSection() {
      if (!currentUser || !directoryData) return;
      const u = currentUser;
      const isMgr = u.user_type === 'Manager';
      const box = document.getElementById('bottomDynamicSection');

      if (isMgr) {
        const rows = directoryData.users || [];
        box.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <h2 class="text-base font-bold text-[#0F172A]" data-i18n="landingDirectoryPreview">${JoomoonApp.t('landingDirectoryPreview')}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${JoomoonApp.t('pageSub_Manager')}</p>
            </div>
            <div class="flex items-center gap-2">
              <a href="users.html?new=1" class="px-3.5 py-2 rounded-lg bg-[#1E3A5F] hover:bg-[#0F172A] text-white text-xs font-semibold transition-colors">
                ${JoomoonApp.t('btnNewUser')}
              </a>
              <a href="users.html" class="px-3.5 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition-colors">
                ${JoomoonApp.t('btnGoUsers')} →
              </a>
            </div>
          </div>

          <div class="overflow-x-auto border border-[#E2E8F0] rounded-lg">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-[#F8FAFC] border-b border-[#E2E8F0] text-[11px] font-bold uppercase tracking-wider text-slate-500">
                  <th class="py-3 px-4">Code / Role</th>
                  <th class="py-3 px-4">${JoomoonApp.t('f_company_name')} / ${JoomoonApp.t('f_manager_name')}</th>
                  <th class="py-3 px-4">${JoomoonApp.t('f_business_number')}</th>
                  <th class="py-3 px-4">${JoomoonApp.t('f_city_district')} / ${JoomoonApp.t('f_country')}</th>
                  <th class="py-3 px-4">${JoomoonApp.t('f_price_tier')}</th>
                  <th class="py-3 px-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-[#E2E8F0] text-xs">
                ${rows.map(r => `
                  <tr class="hover:bg-slate-50/90">
                    <td class="py-3 px-4 font-mono-code">
                      <span class="font-bold text-[#0F172A]">${r.user_code}</span>
                      <span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-semibold ${
                        r.user_type === 'Manager' ? 'bg-blue-950 text-white' :
                        r.user_type === 'Buyer' ? 'bg-teal-700 text-white' : 'bg-slate-600 text-white'
                      }">${r.user_type}</span>
                    </td>
                    <td class="py-3 px-4">
                      <div class="font-semibold text-[#0F172A]">${r.company_name || '(Personal / 개인고객)'}</div>
                      <div class="text-slate-500">${r.manager_name || '-'} · <span class="font-mono-code">${r.login_id}</span></div>
                    </td>
                    <td class="py-3 px-4 font-mono-code text-slate-600">${r.business_number || '-'}</td>
                    <td class="py-3 px-4 text-slate-700">
                      ${r.address1 || ''}, ${r.city_district || ''}, ${r.state_province || ''} (${JoomoonApp.countryFlag(r.country)})
                    </td>
                    <td class="py-3 px-4 font-mono-code">
                      <span class="uppercase font-semibold text-[#1E3A5F]">${r.price_tier}</span> (${r.discount_rate}%) · ${r.currency}
                    </td>
                    <td class="py-3 px-4 text-right">
                      <a href="users.html?id=${r.id}" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md bg-slate-100 hover:bg-[#1E3A5F] text-slate-700 hover:text-white font-semibold transition-colors">
                        <span>Edit</span>
                      </a>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        // Buyer or Customer summary view with direct Edit button
        box.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-slate-200">
            <div>
              <h2 class="text-base font-bold text-[#0F172A]">${JoomoonApp.t('landingMySummaryTitle')}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${JoomoonApp.t('pageSub_Self')}</p>
            </div>
            <a href="users.html" class="px-4 py-2 rounded-lg bg-[#1E3A5F] hover:bg-[#0F172A] text-white text-xs font-semibold transition-colors">
              ${JoomoonApp.t('btnGoMyProfile')} →
            </a>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs">
            <div class="space-y-2 bg-[#F8FAFC] p-4 rounded-lg border border-slate-200">
              <div class="font-bold text-[#1E3A5F] uppercase">${JoomoonApp.t('sec2Title')}</div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_company_name')}:</span> <strong class="text-slate-800">${u.company_name || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_business_number')}:</span> <strong class="font-mono-code text-slate-800">${u.business_number || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_ceo_name')}:</span> <strong class="text-slate-800">${u.ceo_name || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_manager_name')}:</span> <strong class="text-slate-800">${u.manager_name || '-'}</strong> (${u.mobile || u.phone || '-'})</div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_email')}:</span> <strong class="font-mono-code text-slate-800">${u.email || '-'}</strong></div>
            </div>

            <div class="space-y-2 bg-[#F8FAFC] p-4 rounded-lg border border-slate-200">
              <div class="font-bold text-[#1E3A5F] uppercase">${JoomoonApp.t('sec4Title')}</div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_recipient_name')}:</span> <strong class="text-slate-800">${u.recipient_name || '-'} (${u.recipient_phone || '-'})</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_address1')}:</span> <strong class="text-slate-800">${u.address1 || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_address2')}:</span> <strong class="text-slate-800">${u.address2 || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_city_district')} / ${JoomoonApp.t('f_state_province')}:</span> <strong class="text-slate-800">${u.city_district || '-'}, ${u.state_province || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_country')} / ${JoomoonApp.t('f_postal_code')}:</span> <strong class="font-mono-code text-slate-800">${JoomoonApp.countryFlag(u.country)} · ${u.postal_code || '-'}</strong></div>
            </div>

            <div class="space-y-2 bg-[#F8FAFC] p-4 rounded-lg border border-slate-200">
              <div class="font-bold text-[#1E3A5F] uppercase">${JoomoonApp.t('sec6Title')}</div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_bank_name')}:</span> <strong class="text-slate-800">${u.bank_name || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_bank_account_number')}:</span> <strong class="font-mono-code text-slate-800">${u.bank_account_number || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_bank_account_holder')}:</span> <strong class="text-slate-800">${u.bank_account_holder || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_swift_code')}:</span> <strong class="font-mono-code text-slate-800">${u.swift_code || '-'}</strong></div>
              <div><span class="text-slate-500">${JoomoonApp.t('f_tax_invoice_email')}:</span> <strong class="font-mono-code text-slate-800">${u.tax_invoice_email || '-'}</strong></div>
            </div>
          </div>
        `;
      }
    }

    function renderAll() {
      renderLanguageButtons();
      renderSidebarAndHeader();
      renderKpisAndModules();
      renderBottomSection();
    }

    async function loadDemoSwitcherOptions() {
      const res = await fetch('api_auth.php?action=demo_accounts');
      const data = await res.json();
      if (data.ok && data.accounts) {
        const sel = document.getElementById('quickAccountSelect');
        sel.innerHTML = data.accounts.map(a => `
          <option value="${a.login_id}" ${currentUser && currentUser.login_id === a.login_id ? 'selected' : ''}>
            [${a.user_type}] ${a.user_code} · ${a.company_name || a.manager_name}
          </option>
        `).join('');
      }
    }

    async function loadPortalData() {
      const meRes = await fetch('api_auth.php?action=me');
      const meData = await meRes.json();
      if (!meData.ok || !meData.authenticated) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = meData.user;

      const listRes = await fetch('api_users.php?action=list');
      directoryData = await listRes.json();

      await loadDemoSwitcherOptions();
      renderAll();
    }

    loadPortalData();
  </script>
</body>
</html>
